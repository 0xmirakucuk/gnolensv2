# Local development services. Start with `pnpm db:up`.
services:
  postgres:
    # pgvector image from day one so M4 (embeddings) needs no infra change.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bemacs
      POSTGRES_PASSWORD: bemacs
      POSTGRES_DB: bemacs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate `bemacs_test` database used by integration and e2e tests.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bemacs -d bemacs"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email sent in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
